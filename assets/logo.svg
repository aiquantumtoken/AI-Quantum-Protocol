<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="solanaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9945FF" />
      <stop offset="50%" stop-color="#14F195" />
      <stop offset="100%" stop-color="#00C2FF" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0B10" />
      <stop offset="100%" stop-color="#121526" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGrad)" stroke="#1F2438" stroke-width="6" />

  <!-- Quantum Lattice Hexagon Grid -->
  <polygon points="250,70 390,150 390,310 250,390 110,310 110,150" fill="none" stroke="url(#solanaGrad)" stroke-width="4" opacity="0.6" />
  <polygon points="250,110 355,170 355,290 250,350 145,290 145,170" fill="none" stroke="#00F0FF" stroke-width="2" opacity="0.4" stroke-dasharray="6,6" />

  <!-- Core AI Orbit Rings -->
  <circle cx="250" cy="250" r="85" fill="none" stroke="url(#solanaGrad)" stroke-width="8" filter="url(#glow)" />
  
  <!-- Central Quantum Q Core -->
  <circle cx="250" cy="250" r="45" fill="#0E121E" stroke="#14F195" stroke-width="5" />
  
  <!-- Q Stem / Quantum Particle Trail -->
  <line x1="275" y1="275" x2="315" y2="315" stroke="#14F195" stroke-width="8" stroke-linecap="round" />
  
  <!-- Orbiting Nodes (Autonomous Agents) -->
  <circle cx="250" cy="70" r="10" fill="#00C2FF" filter="url(#glow)" />
  <circle cx="390" cy="150" r="10" fill="#9945FF" filter="url(#glow)" />
  <circle cx="390" cy="310" r="10" fill="#14F195" filter="url(#glow)" />
  <circle cx="250" cy="390" r="10" fill="#00C2FF" filter="url(#glow)" />
  <circle cx="110" cy="310" r="10" fill="#9945FF" filter="url(#glow)" />
  <circle cx="110" cy="150" r="10" fill="#14F195" filter="url(#glow)" />

  <!-- Center Typography -->
  <text x="250" y="260" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">AI</text>
</svg>
