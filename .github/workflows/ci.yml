name: CI Protocol Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-protocol:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install base58

    - name: Run End-to-End Test Suite
      run: |
        python -m unittest tests/test_all.py

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Node Dependencies
      run: |
        npm install

    - name: Test Core Agent SDK
      run: |
        node packages/agent-sdk/test.mjs

    - name: Test ElizaOS Plugin Export
      run: |
        node -e "import('./packages/eliza-plugin/index.mjs').then(m => console.log('Eliza Plugin OK:', m.solanaQuantumPlugin.name))"

    - name: Verify Token-2022 Deployment (Dry Run)
      run: |
        node scripts/deploy_token2022.mjs --dry-run

    - name: Verify Raydium Liquidity Pool Deployer (Dry Run)
      run: |
        node scripts/launch_liquidity_pool.mjs

    - name: Verify Security Audit Suite
      run: |
        python scripts/verify_security_audit.py
